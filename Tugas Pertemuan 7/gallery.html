
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Gallery Gunung Sumbing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .popup {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 80px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
        }
        .popup-content {
            background-color: #fff;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            width: 60%;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
            text-align: left;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        .popup img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .close-btn {
            background-color: #0099FF;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .close-btn:hover {
            background-color: #007ACC;
        }
        .popup h2 {
            color: #007ACC;
        }
        .popup p {
            line-height: 1.6;
            color: #333;
        }
        .popup ul {
            margin-top: 8px;
            padding-left: 20px;
        }
        .popup ul li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<table class="layout" cellspacing="0" cellpadding="0">
    <tr>
        <td colspan="2" class="header">
            <h1>WISATA INDONESIA</h1>
            <p>Eksplor Keindahan Alam Nusantara</p>
        </td>
    </tr>

    <tr>
        <td class="sidebar" valign="top">
            <h3>Menu</h3>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </td>

        <td class="content" valign="top">
            <h2>Gallery Gunung Sumbing</h2>
            <p>Klik gambar untuk melihat penjelasan lengkap tentang Gunung Sumbing.</p>

            <table class="gallery-table" cellpadding="10" cellspacing="10">
                <tr align="center">
                    <td>
                        <img src="foto1.jpg" class="gallery-img" alt="Gunung Sumbing" onclick="showPopup('Gunung Sumbing')">
                    </td>
                    <td>
                        <img src="foto2.jpg" class="gallery-img" alt="Gunung Sumbing" onclick="showPopup('Gunung Sumbing')">
                    </td>
                    <td>
                        <img src="foto3.jpg" class="gallery-img" alt="Gunung Sumbing" onclick="showPopup('Gunung Sumbing')">
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td colspan="2" class="footer">
            &copy; 2025 Egi Galih Nurizqi (231011400743) Tugas Pertemuan 7 | <a href="contact.html">Hubungi Kami</a>
        </td>
    </tr>
</table>

<!-- POPUP DETAIL -->
<div id="popup" class="popup">
    <div class="popup-content" id="popup-content">
        <img id="popup-img" src="" alt="Gambar Wisata">
        <h2 id="popup-title"></h2>
        <p id="popup-text"></p>
        <ul id="popup-facts"></ul>
        <button class="close-btn" onclick="closePopup()">Tutup</button>
    </div>
</div>

<script>
function showPopup(place) {
    const popup = document.getElementById("popup");
    const img = document.getElementById("popup-img");
    const title = document.getElementById("popup-title");
    const text = document.getElementById("popup-text");
    const facts = document.getElementById("popup-facts");

    let info = { img: "", title: "", desc: "", facts: [] };

    if (place === "Gunung Sumbing") {
        info.img = "foto1.jpg","foto2.jpg","foto3.jpg";
        info.title = "Objek Wisata Alam – Gunung Sumbing";
        info.desc = "Gunung Sumbing adalah gunung berapi kerucut yang terdapat di Jawa Tengah, Indonesia. Gunung Sumbing merupakan gunung tertinggi ketiga di Pulau Jawa setelah Gunung Semeru dan Gunung Slamet.";
        info.facts = [
            "Objek terkenal: Puncak Gunung Sumbing (3.371 mdpl).",
            "Kegiatan: Mendaki dan berkemah, Menikmati sunrise dan sunset",
            "Waktu terbaik: musim kemarau (Mei hingga September)."
       
        ];
    }

    img.src = info.img;
    title.textContent = info.title;
    text.textContent = info.desc;
    facts.innerHTML = "";
    info.facts.forEach(f => {
        const li = document.createElement("li");
        li.textContent = f;
        facts.appendChild(li);
    });

    popup.style.display = "block";
}
function closePopup() {
    document.getElementById("popup").style.display = "none";
}
</script>
</body>
</html>
